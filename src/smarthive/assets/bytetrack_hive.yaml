# ByteTrack settings for bees at a hive entrance (Ultralytics tracker format).
# Bees are small and often blurred, so low-score detections are kept for the
# second association stage, and lost tracks survive ~1-3 s.
tracker_type: bytetrack
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.3
track_buffer: 30
match_thresh: 0.8
fuse_score: True
