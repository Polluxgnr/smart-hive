<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="system-ui,Segoe UI,sans-serif" font-size="14">
  <title>What the camera should see</title>
  <rect width="640" height="380" fill="#fcfcfb"/>
  <!-- image frame -->
  <rect x="40" y="20" width="560" height="315" fill="#f2e6c9" stroke="#0b0b0b" stroke-width="2"/>
  <!-- hive front -->
  <rect x="40" y="20" width="560" height="85" fill="#d9c79f"/>
  <text x="320" y="62" text-anchor="middle" fill="#52514e">hive front / façade de la ruche</text>
  <!-- slot -->
  <rect x="120" y="100" width="400" height="12" fill="#0b0b0b"/>
  <!-- board -->
  <rect x="100" y="112" width="440" height="160" fill="#b98a4a" opacity="0.65"/>
  <text x="320" y="230" text-anchor="middle" fill="#0b0b0b">landing board / planche d'envol</text>
  <!-- entrance zone -->
  <rect x="112" y="92" width="416" height="44" fill="#1baf7a" opacity="0.25" stroke="#1baf7a" stroke-width="3"/>
  <text x="532" y="88" text-anchor="end" fill="#0b0b0b" font-weight="600">entrance zone (zone d'entrée)</text>
  <!-- hawk zone -->
  <rect x="60" y="140" width="520" height="185" fill="none" stroke="#e34948" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="70" y="318" fill="#0b0b0b" font-weight="600">hawking zone (zone de vol stationnaire)</text>
  <!-- bees -->
  <g fill="#52514e">
    <ellipse cx="200" cy="160" rx="9" ry="5"/><ellipse cx="330" cy="125" rx="9" ry="5" transform="rotate(80 330 125)"/>
    <ellipse cx="420" cy="190" rx="9" ry="5" transform="rotate(30 420 190)"/><ellipse cx="270" cy="250" rx="9" ry="5"/>
  </g>
  <!-- hornet -->
  <ellipse cx="470" cy="275" rx="17" ry="8" fill="#e34948" transform="rotate(-20 470 275)"/>
  <text x="495" y="268" fill="#0b0b0b">hornet</text>
  <!-- grid hint -->
  <text x="40" y="358" fill="#52514e">Coordinates are fractions of the image: top-left (0, 0), bottom-right (1, 1).</text>
  <text x="40" y="375" fill="#52514e">Les coordonnées sont des fractions de l'image : haut-gauche (0, 0), bas-droite (1, 1).</text>
</svg>
